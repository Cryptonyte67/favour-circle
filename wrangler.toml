# The workers.dev URL is <name>.<account subdomain>.workers.dev, so naming the
# Worker "app" against the favour-circle subdomain gives app.favour-circle.workers.dev
# rather than the doubled favour-circle.favour-circle.workers.dev.
name = "app"
main = "src/worker/index.ts"
compatibility_date = "2026-09-06"

# The built client is served straight from the edge. run_worker_first lists the
# paths the Worker owns: the API, the public preview pages, the capability probe
# and the help guide. Everything else is a static asset, and anything unmatched
# falls back to index.html so the app's client-side routes resolve.
[assets]
directory = "./dist/web"
binding = "ASSETS"
run_worker_first = ["/api/*", "/t/*", "/join/*", "/diag", "/diag/*", "/open", "/help/*", "/healthz"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "favour-circle"
database_id = "b2237967-83bd-458e-bed2-3ddeb2ff893a"

[vars]
# Overridden per environment. Must be the real public origin in production,
# because Nimiq Pay deeplinks are built from it.
APP_URL = "https://app.favour-circle.workers.dev"

[dev]
port = 8787
